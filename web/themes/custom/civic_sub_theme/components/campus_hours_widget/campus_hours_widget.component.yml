$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

name: Campus Hours Widget
label: Campus Hours Widget
group: CSN Libraries

props:
  type: object
  properties:
    campus:
      type: string
      title: Campus
      description: Select the campus whose live library hours should be displayed.
      enum:

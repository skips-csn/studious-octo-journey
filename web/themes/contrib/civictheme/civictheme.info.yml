name: CivicTheme
type: theme
base theme: false
description: CivicTheme is a Drupal component-based theme.
core_version_requirement: ^10.2 || ^11

libraries:
  - 'civictheme/global'
  - 'civictheme/css-variables'

# Suppress core's contextual.module.css — the theme owns these base styles
# via assets/sass/block/_contextual.scss so .contextual-region can be
# wrapped in :where() and stop blocking component positioning.
libraries-override:
  contextual/drupal.contextual-links:
    css:
      component:
        css/contextual.module.css: false

dependencies:
  - drupal:block
  - drupal:block_content
  - drupal:ckeditor5
  - drupal:config
  - drupal:content_moderation
  - drupal:contextual
  - drupal:datetime
  - drupal:datetime_range
  - drupal:editor
  - drupal:file
  - drupal:filter
  - drupal:help
  - drupal:image
  - drupal:inline_form_errors
  - drupal:layout_builder
  - drupal:layout_discovery
  - drupal:link
  - drupal:media
  - drupal:media_library
  - drupal:menu_ui
  - drupal:node
  - drupal:options
  - drupal:path
  - drupal:rest
  - drupal:serialization
  - drupal:shortcut
  - drupal:system
  - drupal:taxonomy
  - drupal:text
  - drupal:user
  - drupal:views
  - entity_reference_revisions:entity_reference_revisions
  - field_group:field_group
  - focal_point:focal_point
  - layout_builder_restrictions:layout_builder_restrictions
  - linkit:linkit
  - menu_block:menu_block
  - paragraphs:paragraphs
  - pathauto:pathauto
  - redirect:redirect
  - webform:webform

regions:
  header_top_1: 'Header top 1'
  header_top_2: 'Header top 2'
  header_top_3: 'Header top 3'
  header_middle_1: 'Header middle 1'
  header_middle_2: 'Header middle 2'
  header_middle_3: 'Header middle 3'
  header_bottom_1: 'Header bottom 1'
  banner: 'Banner'
  highlighted: 'Highlighted'
  content_top: 'Content Top'
  content: 'Content'
  content_bottom: 'Content Bottom'
  sidebar_top_left: 'Sidebar Top Left'
  sidebar_bottom_left: 'Sidebar Bottom Left'
  sidebar_top_right: 'Sidebar Top Right'
  sidebar_bottom_right: 'Sidebar Bottom Right'
  footer_top_1: 'Footer top 1'
  footer_top_2: 'Footer top 2'
  footer_middle_1: 'Footer middle 1'
  footer_middle_2: 'Footer middle 2'
  footer_middle_3: 'Footer middle 3'
  footer_middle_4: 'Footer middle 4'
  footer_bottom_1: 'Footer bottom 1'
  footer_bottom_2: 'Footer bottom 2'
  hidden: 'Hidden'

features:
  - favicon

ckeditor5-stylesheets:
  - dist/civictheme.editor.css
  - dist/civictheme.variables.css
  # Using colors from the Color Selector is not supported until the issue
  # below is resolved.
  # @see https://www.drupal.org/project/drupal/issues/3406959
  # - /sites/default/files/css-variables.civictheme.css

# Information added by Drupal.org packaging script on 2026-05-05
version: '1.13.0'
project: 'civictheme'
datestamp: 1777987739

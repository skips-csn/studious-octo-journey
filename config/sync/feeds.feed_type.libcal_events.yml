uuid: 67b8fcb9-c591-48b0-bfc2-ac36b3960932
langcode: en
status: true
dependencies:
  config:
    - field.field.node.civictheme_event.feeds_item
    - field.field.node.civictheme_event.field_c_n_body
    - field.field.node.civictheme_event.field_c_n_date_range
    - field.field.node.civictheme_event.field_c_n_location
    - node.type.civictheme_event
  module:
    - feeds_ex
    - node
label: 'LibCal Events'
id: libcal_events
description: 'Events from Libcal'
help: ''
import_period: 3600
import_period_per_feed: false
fetcher: http
fetcher_configuration:
  auto_detect_feeds: false
  use_pubsubhubbub: false
  always_download: false
  fallback_hub: ''
  request_timeout: 30
parser: xml
parser_configuration:
  context:
    value: rss/channel/item
  source_encoding:
    - auto
  display_errors: false
  line_limit: 100
  use_tidy: false
processor: 'entity:node'
processor_configuration:
  values:
    type: civictheme_event
  langcode: en
  insert_new: 1
  update_existing: 2
  update_non_existent: _delete
  skip_hash_check: false
  skip_validation: false
  skip_validation_types: {  }
  authorize: true
  revision: false
  expire: 7776000
  owner_feed_author: false
  owner_id: 0
custom_sources:
  libcal_xpath_start:
    label: 'LibCal XPATH Start'
    machine_name: libcal_xpath_start
    value: "concat(substring(*[local-name()='date'], 1, 10), 'T', substring(*[local-name()='start'], 1, 8))"
    raw: false
    inner: false
    type: xml
  libcal_xpath_end:
    label: 'LibCal XPATH End'
    machine_name: libcal_xpath_end
    value: "concat(substring(*[local-name()='date'], 1, 10), 'T', substring(*[local-name()='end'], 1, 8))"
    raw: false
    inner: false
    type: xml
  libcal_xpath_location:
    label: 'LibCal XPATH Location'
    machine_name: libcal_xpath_location
    value: "*[local-name()='location']"
    raw: false
    inner: false
    type: xml
  libcal_xpath_body:
    label: 'LibCal XPATH Body'
    machine_name: libcal_xpath_body
    value: description
    raw: false
    inner: false
    type: xml
  libcal_xpath_title:
    label: 'LibCal XPATH Title'
    machine_name: libcal_xpath_title
    value: title
    raw: false
    inner: false
    type: xml
  libcal_xpath_guid:
    label: 'LibCal XPATH GUID'
    machine_name: libcal_xpath_guid
    value: guid
    raw: false
    inner: false
    type: xml
mappings:
  -
    target: feeds_item
    map:
      url: ''
      guid: libcal_xpath_guid
    settings: {  }
    unique:
      guid: 1
  -
    target: field_c_n_body
    map:
      value: libcal_xpath_body
    settings:
      language: ''
      format: full_html
  -
    target: field_c_n_date_range
    map:
      value: libcal_xpath_start
      end_value: libcal_xpath_end
    settings:
      language: ''
      timezone: America/Los_Angeles
  -
    target: title
    map:
      value: libcal_xpath_title
    settings:
      language: null
    unique: {  }
  -
    target: field_c_n_location
    map:
      value: libcal_xpath_location
    settings:
      language: ''
      format: civictheme_plain_text

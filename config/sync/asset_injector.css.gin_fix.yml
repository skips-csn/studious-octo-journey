id: gin_fix
label: 'Gin Fix'
code: |
  /* Force all Gin dropbutton menus to expand toward the right */
  .gin--edit-form .dropbutton-wrapper.open .dropbutton,
  .gin--edit-form .dropbutton-wrapper.open .dropbutton-widget,
  .gin--edit-form .dropbutton-wrapper.open .dropbutton__items,
  .paragraphs-dropbutton-wrapper .dropbutton-wrapper.open .dropbutton {
    right: auto !important;
    left: 0 !important;
    inset-inline-end: auto !important;
    inset-inline-start: 0 !important;
    transform: none !important;
  }

  /* Prevent parent Gin wrappers and table scroll containers from clipping */
  .gin-layer-wrapper,
  .gin-table-scroll-wrapper,
  .field--widget-paragraphs,
  .field--widget-entity-reference-paragraphs {
    overflow: visible !important;
  }
media: all

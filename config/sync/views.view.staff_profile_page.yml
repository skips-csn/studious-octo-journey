          alter:
            alter_text: true
            text: "<div class=\"civictheme-custom-profile-canvas\" style=\"padding: 24px; max-width: 900px; margin: 0 auto; font-family: sans-serif; line-height: 1.6;\">\r\n  \r\n  <!-- Profile Title & Roles Header -->\r\n  <div class=\"profile-header\" style=\"border-bottom: 2px solid #e2e8f0; padding-bottom: 16px; margin-bottom: 24px;\">\r\n    <h1 style=\"margin: 0 0 12px 0; font-size: 2.5em; color: #1a202c; font-weight: 700;\">{{ title }}</h1>\r\n    \r\n    <div class=\"profile-roles\" style=\"margin: 0;\">\r\n      {% if field_role %}\r\n        <h2 style=\"margin: 0; font-size: 1.6em; color: #2d3748; font-weight: 600; display: inline-block;\">{{ field_role }}</h2>\r\n      {% endif %}\r\n      {% if field_role_2 %}\r\n        <h2 style=\"margin: 0; font-size: 1.6em; color: #718096; font-weight: 400; display: inline-block;\"> &bull; {{ field_role_2 }}</h2>\r\n      {% endif %}\r\n    </div>\r\n  </div>\r\n\r\n  <!-- Profile Metadata Grid Structure -->\r\n  <div class=\"profile-grid\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; margin-bottom: 32px;\">\r\n    \r\n    <!-- Contact & Details Column -->\r\n    <div class=\"profile-contact-info\" style=\"background-color: #f7fafc; padding: 20px; border-radius: 8px; border: 1px solid #edf2f7; display: flex; flex-direction: column; justify-content: center;\">\r\n      {% if field_email %}\r\n        <p style=\"margin: 0 0 12px 0; font-size: 1.1em;\"><strong>Email:</strong> <a href=\"mailto:{{ field_email|striptags|trim }}\" style=\"color: #3182ce; text-decoration: none;\">{{ field_email }}</a></p>\r\n      {% endif %}\r\n      \r\n      {% if field_office_phone %}\r\n        <p style=\"margin: 0 0 12px 0; font-size: 1.1em;\"><strong>Office Phone:</strong> {{ field_office_phone }}</p>\r\n      {% endif %}\r\n      \r\n      {% if field_schedule_appointment %}\r\n        <p style=\"margin: 12px 0 0 0;\"><a href=\"{{ field_schedule_appointment|striptags|trim }}\" target=\"_blank\" style=\"display: inline-block; background-color: #3182ce; color: white; padding: 10px 20px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 1em;\">Schedule Appointment</a></p>\r\n      {% endif %}\r\n    </div>\r\n\r\n    <!-- Organization Placement Column (Department Completely Removed) -->\r\n    <div class=\"profile-org-info\" style=\"background-color: #f7fafc; padding: 20px; border-radius: 8px; border: 1px solid #edf2f7; display: flex; flex-direction: column; justify-content: center;\">\r\n      {% if field_home_campus %}\r\n        <p style=\"margin: 0; font-size: 1.1em;\"><strong>Home Campus:</strong> {{ field_home_campus }}</p>\r\n      {% endif %}\r\n    </div>\r\n\r\n  </div>\r\n</div>\r\n"
